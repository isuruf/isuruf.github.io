jobs:
  example-1:
    name: ${{ matrix.pkg }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.11"]
        pkg: ["libgdal=3.9.0", "libgdal-core=3.9.1"]
    steps:
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: ${{ matrix.python-version }}
      - name: Conda info
        shell: bash -el {0}
        run: conda info
      - name: Conda list
        shell: pwsh
        run: conda list
      - name: Install gdal
        shell: bash -el {0}
        run: conda create -n gdal libgdal=3.9.0
        env:
          PKG: ${{ matrix.pkg }}
